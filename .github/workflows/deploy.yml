name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-production
  cancel-in-progress: false
jobs:
  deploy:
    # Experimental branches must never invoke the production receiver.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:seo
      - name: Publish production
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/website_key
          chmod 600 ~/.ssh/website_key
          tar -czf /tmp/website.tar.gz -C dist .
          ssh -i ~/.ssh/website_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=config/production-known-hosts glissform-website-deploy@159.194.226.154 "deploy $GITHUB_SHA" < /tmp/website.tar.gz
          curl --fail --retry 3 https://glissform.app/deployment.json | grep -F "$GITHUB_SHA"
