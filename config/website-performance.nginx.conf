# Include inside the existing glissform.app server block.
# This file is prepared locally; it is not installed by the website receiver.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript text/css image/svg+xml;
gzip_static on;

# Vite fingerprints imported images, scripts, styles and fonts by content.
location ~ ^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[a-z0-9]+$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Unfingerprinted assets can change between deployments; revalidate them.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}
