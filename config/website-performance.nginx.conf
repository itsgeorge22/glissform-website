# Install as /etc/nginx/snippets/glissform-website-performance.conf and
# include inside the existing HTTPS glissform.app server block.
# Server configuration is maintained separately from the website receiver.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/javascript text/css image/svg+xml;
gzip_static on;

# Astro uses dot-separated content hashes. Plain hyphenated asset names and
# retained legacy Vite files safely revalidate through the rule below.
location ~ "^/assets/[^/]+\.[A-Za-z0-9_-]{8,}\.[a-z0-9]+$" {
    try_files $uri =404;
    include /etc/nginx/snippets/glissform-website-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Unfingerprinted assets can change between deployments; revalidate them.
location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/glissform-website-security.conf;
    add_header Cache-Control "no-cache";
}

location /models/ {
    try_files $uri =404;
    include /etc/nginx/snippets/glissform-website-security.conf;
    add_header Cache-Control "no-cache";
}

# Directory requests internally resolve to these index files too.
location ~ ^/(index\.html|privacy/index\.html)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/glissform-website-security.conf;
    add_header Cache-Control "no-cache";
}

# Discovery files and the deployment marker must stay current.
location ~ ^/(robots\.txt|sitemap\.xml|deployment\.json)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/glissform-website-security.conf;
    add_header Cache-Control "no-cache";
}
