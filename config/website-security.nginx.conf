# Install as /etc/nginx/snippets/glissform-website-security.conf.
# Include in each HTTPS server and every location that sets add_header:
# Nginx 1.24 otherwise replaces, rather than merges, inherited headers.

# Start with one day; extend after the HTTPS/renewal rollout is verified.
# Do not add includeSubDomains or preload without reviewing every subdomain.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enforce only the restrictions independent of script/style execution.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

# Candidate resource/Trusted Types policy, deliberately NOT enforced.
# Astro's inline bootstrap and any Trusted Types sinks need review first.
# Inline styles support the existing React/GSAP motion; blob images/workers
# support the local Three.js model pipeline. PostHog is the sole external
# connection origin, and application consent still gates its requests.
# No report endpoint is configured: inspect browser console diagnostics
# during review without adding visitor telemetry or a reporting service.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://eu.i.posthog.com; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; require-trusted-types-for 'script'" always;
