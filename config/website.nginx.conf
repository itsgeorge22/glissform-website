# Install as /etc/nginx/sites-available/glissform.app after issuing a
# certificate covering both glissform.app and www.glissform.app.
server {
    listen 80;
    listen [::]:80;
    server_name glissform.app www.glissform.app;
    root /var/www/glissform.app;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://glissform.app$request_uri;
    }
}

server {
    # The listen parameter supports the deployed Nginx 1.24 release.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.glissform.app;
    ssl_certificate /etc/letsencrypt/live/glissform.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glissform.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/glissform-website-security.conf;
    return 301 https://glissform.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glissform.app;
    root /var/www/glissform.app;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/glissform.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glissform.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/glissform-website-security.conf;
    include /etc/nginx/snippets/glissform-website-performance.conf;

    # Retire the preview page; retain its old assets for open/cached tabs.
    location = /v2 { return 301 /$is_args$args; }
    location = /v2/ { return 301 /$is_args$args; }
    location = /v2/index.html { return 301 /$is_args$args; }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /updates/appcast.xml {
        include /etc/nginx/snippets/glissform-website-security.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location /downloads/ {
        include /etc/nginx/snippets/glissform-website-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
